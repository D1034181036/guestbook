<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>留言簿範例</title>
    <link rel="stylesheet" href="guestbook.css">
    <script defer src="guestbook.js"></script>
    <style>
        body { max-width: 640px; margin: 0 auto; padding: 24px 16px; font-family: sans-serif; }
    </style>
</head>
<body>
    <h1>留言簿</h1>

    <form id="gb-form" class="gb-form" action="https://script.google.com/macros/s/你的部署ID/exec" method="post" target="_blank">
        <input type="text" name="name" placeholder="您的名稱" aria-label="您的名稱" maxlength="50" required>
        <input type="url" name="website" placeholder="您的網址（選填）" aria-label="您的網址（選填）" maxlength="200" pattern="https?://.+" title="請輸入 http:// 或 https:// 開頭的網址">
        <textarea name="text" placeholder="在這裡留言吧～" aria-label="留言內容" rows="4" maxlength="1000" required></textarea>
        <button type="submit">送出</button>
        <div class="gb-error" role="alert"></div>
        <div class="gb-success" role="status" hidden>感謝您的留言，等待審核中！</div>
    </form>

    <h2>留言</h2>
    <noscript><p>請開啟 JavaScript 以查看留言。</p></noscript>
    <div id="gb-messages" class="gb-messages" data-reply-name="站長回覆"></div>
</body>
</html>
